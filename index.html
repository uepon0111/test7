<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>プロセカ リザルト画像読み取り</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
  <div>
    <h1>プロセカ リザルト画像読み取り</h1>
    <p>画像内の枠・文字領域を自動検出し、A〜IをOCRします。</p>
  </div>
  <div class="actions">
    <label class="button primary">
      画像を選択
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    </label>
    <button id="runButton" class="button" disabled>読み取り開始</button>
    <button id="rerunOcrButton" class="button" disabled>OCRだけ再実行</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="card-title">
      <h2>画像</h2>
      <span id="status" class="status">画像を選択してください</span>
    </div>
    <div class="viewer-wrap">
      <canvas id="sourceCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="emptyState">ここにリザルト画像を表示します</div>
    </div>
    <div class="legend">
      <span><i class="red"></i>白枠下端</span>
      <span><i class="blue"></i>白枠左右</span>
      <span><i class="green"></i>ジャケット右端・ゲージ左端</span>
      <span><i class="yellow"></i>ジャケット上下・中央</span>
      <span><i class="purple"></i>難易度・レベル</span>
      <span><i class="pink"></i>判定行</span>
      <span><i class="cyan"></i>判定欄左右・LATE/FAST左</span>
    </div>
  </section>

  <section class="grid two">
    <div class="card">
      <div class="card-title"><h2>取得結果</h2></div>
      <div class="result-grid">
        <div><span>楽曲タイトル</span><strong id="outTitle">—</strong></div>
        <div><span>難易度</span><strong id="outDifficulty">—</strong></div>
        <div><span>楽曲レベル</span><strong id="outLevel">—</strong></div>
        <div><span>PERFECT</span><strong id="outPerfect">—</strong></div>
        <div><span>GREAT</span><strong id="outGreat">—</strong></div>
        <div><span>GOOD</span><strong id="outGood">—</strong></div>
        <div><span>BAD</span><strong id="outBad">—</strong></div>
        <div><span>MISS</span><strong id="outMiss">—</strong></div>
        <div><span>COMBO</span><strong id="outCombo">—</strong></div>
      </div>
      <div id="ocrNotice" class="notice"></div>
    </div>

    <div class="card">
      <div class="card-title"><h2>検出座標</h2></div>
      <pre id="geometryOutput" class="mono">まだ検出していません。</pre>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>領域 A〜I</h2>
      <span class="muted">処理前 / 処理後</span>
    </div>
    <div id="regions" class="regions"></div>
  </section>

  <section class="card">
    <div class="card-title">
      <h2>デバッグ</h2>
      <div class="debug-tabs">
        <button class="tab active" data-debug="scans">スキャンデータ</button>
        <button class="tab" data-debug="ocr">OCRログ</button>
        <button class="tab" data-debug="profile">画像プロファイル</button>
      </div>
    </div>
    <pre id="debugOutput" class="mono">デバッグ情報はここに表示されます。</pre>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
